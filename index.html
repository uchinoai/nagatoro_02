<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像リンク</title>
  <style>
    /* 画面全体の中央に配置するための設定 */
    body {
      margin: 0;
      display: flex;
      justify-content: center; /* 左右の真ん中 */
      align-items: center;    /* 上下の真ん中 */
      min-height: 100vh;      /* 画面の高さいっぱいに広げる */
    }

    /* 画像が画面からはみ出ないようにする設定（スマホ対応） */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <a href="https://harekaze.kirin.co.jp/hanabi/event/saitama_nagatoro/" target="_blank" rel="noopener noreferrer">
    <img src="https://uchinoai.github.io/nagatoro_02/funadama6.jpg" alt="長瀞船玉まつりの画像">
  </a>

</body>
</html>
